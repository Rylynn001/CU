services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: comfyui
      TZ: Asia/Shanghai
    volumes:
      - ./mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3306:3306"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6379:6379"
    restart: unless-stopped

  background:
    build: ./background
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: comfyui
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./background:/app
      - ./background/output:/app/output
      - ./background/input:/app/input
      - ./background/voice:/app/voice
      # - /mnt/aistudio/Comfy/output:/app/output
      # - /mnt/aistudio/Comfy/input:/app/input
      # - /mnt/aistudio/Comfy/voice:/app/voice
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  comfy-web:
    build: ./comfy-web
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "80:80"
    depends_on:
      - background
    restart: unless-stopped
